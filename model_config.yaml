# 阶段5（LSTM）推荐配置
# 说明：当前 train_lstm.py 以 CLI 参数为准；本文件用于沉淀可复用参数模板。

stage5_lstm:
  in_path: data/features/features_v1.parquet
  split_manifest: data/processed/split_manifest.json
  feature_manifest: data/features/feature_manifest.json
  target_col: label_excess_ret_5d

  # 时序样本
  seq_len: 20

  # 滚动训练
  retrain_every: 40
  train_window: 0          # 0=扩展窗口；>0=固定最近N日
  min_train_days: 240
  min_train_samples: 1200
  inner_val_days: 60

  # LSTM结构
  hidden_size: 64
  num_layers: 2
  dropout: 0.1

  # 训练超参
  loss: huber              # mse | huber
  huber_delta: 1.0
  epochs: 12
  batch_size: 256
  pred_batch_size: 1024
  lr: 0.001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  early_stop_patience: 4
  early_stop_min_delta: 1.0e-5

  # 其他
  device: auto             # auto | cpu | cuda
  gpu_index: 0             # auto/cuda时优先尝试的GPU索引
  gpu_min_memory_gb: 0.0   # auto/cuda时GPU最小显存阈值
  seed: 42
  n_quantiles: 5

  # 输出
  out: data/dl/dl_result.csv
  metrics_out: data/dl/dl_metrics.csv
  trainlog_out: data/dl/dl_trainlog.csv
  report_out: data/dl/dl_report.md
  model_out: data/dl/checkpoints/lstm_latest.pt
  model_meta_out: data/dl/checkpoints/lstm_latest_meta.json
  save_each_retrain: false
  checkpoint_dir: data/dl/checkpoints/rolling

stage5_1_lstm:
  in_path: data/features/features_v1.parquet
  split_manifest: data/processed/split_manifest.json
  feature_manifest: data/features/feature_manifest.json
  target_col: label_excess_ret_5d

  seq_len: 20

  # 阶段5.1：近期窗口 + 更频繁重训
  retrain_every: 20
  train_window: 750
  min_train_days: 240
  min_train_samples: 1200
  inner_val_days: 40

  hidden_size: 64
  num_layers: 2
  dropout: 0.1

  loss: huber
  huber_delta: 1.0
  epochs: 10
  batch_size: 256
  pred_batch_size: 1024
  lr: 0.001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  early_stop_patience: 4
  early_stop_min_delta: 1.0e-5

  device: auto
  gpu_index: 0
  gpu_min_memory_gb: 4.0
  seed: 42
  n_quantiles: 5

  out: data/dl/dl_v51_result.csv
  metrics_out: data/dl/dl_v51_metrics.csv
  trainlog_out: data/dl/dl_v51_trainlog.csv
  report_out: data/dl/dl_v51_report.md
  model_out: data/dl/checkpoints/lstm_v51_latest.pt
  model_meta_out: data/dl/checkpoints/lstm_v51_latest_meta.json
  save_each_retrain: false
  checkpoint_dir: data/dl/checkpoints/rolling_v51

stage5_2_selector:
  # 使用阶段5的LSTM结果 + 阶段4.1 baseline结果做动态模型选择
  # 对应LSTM推理权重：data/dl/checkpoints/lstm_latest.pt
  lstm_result: data/dl/dl_result.csv
  anchor_result: data/baseline/baseline_v41_result.csv
  anchor_col: pred_tree
  target_col: label_excess_ret_5d

  # 动态选择器参数
  lookback_days: 8
  label_delay_days: 7
  warmup_pick: anchor

  # 参数扫表候选
  lookback_grid: 5,6,7,8,9,10,12,15,20,30,40
  delay_grid: 0,3,5,7,10

  out: data/dl/dl_v52_result.csv
  metrics_out: data/dl/dl_v52_metrics.csv
  selector_log_out: data/dl/dl_v52_selector_log.csv
  sweep_out: data/dl/dl_v52_sweep.csv
  report_out: data/dl/dl_v52_report.md
